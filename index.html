        preferredExVariant: { ...base.preferredExVariant, ...(incoming.preferredExVariant || {}) },
        dailyLogs: { ...base.dailyLogs, ...(incoming.dailyLogs || {}) },
        sessionHistory: Array.isArray(incoming.sessionHistory) ? incoming.sessionHistory : [],
        bodyLogs: Array.isArray(incoming.bodyLogs) && incoming.bodyLogs.length > 0 ? incoming.bodyLogs : base.bodyLogs
      };
      if (!WORKOUTS[merged.selectedWorkoutId]) merged.selectedWorkoutId = 'A';
      if (!DIET_MODES[merged.dietMode]) merged.dietMode = 'base';
      if (merged.kgStepSize !== 1 && merged.kgStepSize !== 2.5) merged.kgStepSize = 1;
      return merged;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state = mergeStateSafely(JSON.parse(raw));
        }
      } catch (err) {
        console.warn('Erro ao ler localStorage:', err);
        state = createInitialState();
      }
    }

    function persistState() {
      state.updatedAt = Date.now();
      const dot = document.getElementById('syncDot');
      if (dot) {
        dot.classList.remove('bg-[#14b8a6]');
        dot.classList.add('bg-amber-400');
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('Erro ao salvar localStorage:', err);
      }
      setTimeout(() => {
        if (dot) {
          dot.classList.remove('bg-amber-400');
          dot.classList.add('bg-[#14b8a6]');
        }
      }, 220);
    }

    /**
     * ============================================================================
     * UTILITÁRIOS (DATAS, SOM, VIBRAÇÃO, MODAIS E TOASTS)
     * ============================================================================
     */
    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getStartOfCurrentWeekMs() {
      const now = new Date();
      const day = now.getDay(); // 0=Dom, 1=Seg...
      const diffToMonday = day === 0 ? -6 : (1 - day);
      const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday, 0, 0, 0, 0);
      return mon.getTime();
    }

    function formatShortDate(isoOrYmd) {
      if (!isoOrYmd) return '--/--';
      const part = String(isoOrYmd).slice(0, 10);
      const [y, m, d] = part.split('-');
      if (!y || !m || !d) return part;
      return `${d}/${m}/${y.slice(2)}`;
    }

    function formatShortDateTime(iso) {
      if (!iso) return '--';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return formatShortDate(iso);
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function formatMMSS(totalSec) {
      const s = Math.max(0, Math.floor(Number(totalSec) || 0));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function playRestDoneSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        [587.33, 880].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.16);
          gain.gain.setValueAtTime(0.14, now + i * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.16);
          osc.stop(now + i * 0.16 + 0.15);
        });
      } catch (e) {}
      if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
        try { navigator.vibrate([120, 70, 120]); } catch (e) {}
      }
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const style = type === 'error'
        ? 'bg-rose-600 text-white border-rose-400/40'
        : type === 'info'
          ? 'bg-slate-800 text-slate-100 border-slate-600'
          : 'bg-teal-600 text-white border-teal-300/40';
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border text-xs font-bold shadow-xl animate-in ${style}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    function openModal({ title, bodyHtml, confirmText = 'Confirmar', cancelText = 'Fechar', hideConfirm = false, onConfirm = null }) {
      const modal = document.getElementById('appModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      const cBtn = document.getElementById('modalConfirmBtn');
      const xBtn = document.getElementById('modalCancelBtn');
      cBtn.textContent = confirmText;
      xBtn.textContent = cancelText;
      cBtn.classList.toggle('hidden', Boolean(hideConfirm));
      ui.modalConfirmCb = onConfirm;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('appModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      ui.modalConfirmCb = null;
    }

    /**
     * ============================================================================
     * CRONÔMETROS (DESCANSO + PRANCHA + SESSÃO)
     * ============================================================================
     */
    function startRestTimer(seconds, label = 'Descanso') {
      stopRestTimer();
      ui.restRemainingSec = Math.max(5, Number(seconds) || 45);
      const bar = document.getElementById('restTimerBar');
      const disp = document.getElementById('restTimerDisplay');
      const lbl = document.getElementById('restTimerLabel');
      if (lbl) lbl.textContent = label;
      if (bar && disp) {
        disp.textContent = formatMMSS(ui.restRemainingSec);
        bar.classList.remove('hidden');
      }
      ui.restInterval = setInterval(() => {
        ui.restRemainingSec--;
        if (disp) disp.textContent = formatMMSS(ui.restRemainingSec);
        if (ui.restRemainingSec <= 0) {
          stopRestTimer();
          playRestDoneSound();
          showToast(label === 'Prancha' ? '✨ Prancha concluída! Ótima postura!' : '⏱ Descanso concluído! Próxima série!', 'success');
        }
      }, 1000);
    }

    function stopRestTimer() {
      clearInterval(ui.restInterval);
      ui.restInterval = null;
      ui.restRemainingSec = 0;
      const bar = document.getElementById('restTimerBar');
      if (bar) bar.classList.add('hidden');
    }

    function getSessionElapsedSec(s = state.activeSession) {
      if (!s) return 0;
      const base = Number(s.accumulatedSec) || 0;
      if (!s.running || !s.resumedAt) return base;
      return base + Math.max(0, Math.floor((Date.now() - s.resumedAt) / 1000));
    }

    function ensureRunningSessionTicker() {
      clearInterval(ui.sessionTickInterval);
      if (!state.activeSession || !state.activeSession.running) return;
      ui.sessionTickInterval = setInterval(() => {
        if (!state.activeSession || !state.activeSession.running) {
          clearInterval(ui.sessionTickInterval);
          return;
        }
        const elapsed = getSessionElapsedSec(state.activeSession);
        const timerEl = document.getElementById('sessionTimerDisplay');
        const barEl = document.getElementById('sessionTimeBar');
        if (timerEl) timerEl.textContent = formatMMSS(elapsed);
        if (barEl) {
          const pct = Math.min(100, Math.round((elapsed / (30 * 60)) * 100));
          barEl.style.width = `${pct}%`;
        }
      }, 1000);
    }

    /**
     * ============================================================================
     * ROTAÇÃO A -> B -> C -> D, SUBSTITUTOS E PROGRESSÃO SEGURA (12 ANOS)
     * ============================================================================
     */
    function getGymHistory() {
      return (state.sessionHistory || []).filter(s => s.type === 'gym');
    }

    function getRecommendedWorkoutId() {
      const gymHist = getGymHistory();
      if (gymHist.length === 0) return 'A';
      const lastId = gymHist[0].workoutId;
      const idx = WORKOUT_ORDER.indexOf(lastId);
      return idx === -1 ? 'A' : WORKOUT_ORDER[(idx + 1) % WORKOUT_ORDER.length];
    }

    function getLastSessionForWorkout(wId) {
      return getGymHistory().find(s => s.workoutId === wId) || null;
    }

    function getLastRecordForExercise(exId, preferredName = null) {
      const gymHist = getGymHistory();
      // Primeiro tenta achar pelo mesmo nome exato (caso use substituta)
      if (preferredName) {
        for (const sess of gymHist) {
          const found = (sess.exercises || []).find(e => e.exId === exId && e.executedName === preferredName && e.sets.some(st => st.done));
          if (found) {
            return {
              date: sess.completedAt,
              executedName: found.executedName,
              isTimeBased: Boolean(found.isTimeBased),
              sets: found.sets.filter(st => st.done)
            };
          }
        }
      }
      // Fallback: último registro daquele slot de exercício
      for (const sess of gymHist) {
        const found = (sess.exercises || []).find(e => e.exId === exId && e.sets.some(st => st.done));
        if (found) {
          return {
            date: sess.completedAt,
            executedName: found.executedName,
            isTimeBased: Boolean(found.isTimeBased),
            sets: found.sets.filter(st => st.done)
          };
        }
      }
      return null;
    }

    function getExerciseVariants(ex) {
      const list = [{
        name: ex.name,
        shortName: ex.shortName || ex.name,
        videoId: ex.videoId,
        note: ex.tip,
        isTimeBased: Boolean(ex.isTimeBased),
        repMin: ex.isTimeBased ? (ex.timeMin || 30) : ex.repMin,
        repMax: ex.isTimeBased ? (ex.timeMax || 40) : ex.repMax,
        repLabel: ex.repLabel || `${ex.repMin}–${ex.repMax}`,
        isPrincipal: true
      }];
      if (Array.isArray(ex.substitutes)) {
        ex.substitutes.forEach(s => {
          const isTime = typeof s.isTimeBased === 'boolean' ? s.isTimeBased : Boolean(ex.isTimeBased);
          const rMin = isTime ? (s.timeMin || 30) : (s.repMin || ex.repMin || 12);
          const rMax = isTime ? (s.timeMax || 40) : (s.repMax || ex.repMax || 15);
          list.push({
            name: s.name,
            shortName: s.shortName || s.name,
            videoId: s.videoId || ex.videoId,
            note: s.note || ex.tip,
            isTimeBased: isTime,
            repMin: rMin,
            repMax: rMax,
            repLabel: isTime ? `${rMin}–${rMax}s` : (rMin === rMax ? `${rMax}` : `${rMin}–${rMax}`),
            isPrincipal: false
          });
        });
      }
      return list;
    }

    function getActiveExerciseOption(ex, variantIndex = 0) {
      const list = getExerciseVariants(ex);
      const safeIdx = (typeof variantIndex === 'number' && variantIndex >= 0 && variantIndex < list.length) ? variantIndex : 0;
      return { ...list[safeIdx], index: safeIdx, totalVariants: list.length };
    }

    /**
     * Progressão Segura Pediátrica:
     * Só sugere leve aumento de carga quando completar TODAS as séries em 15 reps (ou teto) com boa postura.
     */
    function getSafeProgressionSuggestion(ex, activeOpt, lastRec) {
      if (activeOpt.isTimeBased) {
        if (!lastRec || !lastRec.sets.length) {
          return {
            type: 'init',
            label: '🛡️ Postura Primeiro',
            text: `Comece segurando ${activeOpt.repMin}s bem alinhada (sem deixar o quadril cair) e evolua aos poucos até ${activeOpt.repMax}s.`
          };
        }
        const allMax = lastRec.sets.length >= ex.sets && lastRec.sets.every(st => Number(st.reps) >= activeOpt.repMax);
        return allMax
          ? { type: 'up', label: '✨ Excelente Controle', text: `Você completou ${activeOpt.repMax}s em todas! Mantenha 40s perfeitos focando em respiração calma e abdômen firme.` }
          : { type: 'keep', label: '🎯 Evolução Gradual', text: `Tente manter +2 a +5 segundos com postura impecável até alcançar ${activeOpt.repMax}s em todas.` };
      }

      const targetMax = activeOpt.repMax || 15;
      if (!lastRec || !lastRec.sets || lastRec.sets.length === 0) {
        return {
          type: 'init',
          label: '🛡️ Estreia Segura',
          text: `Use carga leve/moderada para fazer ${activeOpt.repLabel} reps controladas (2s descida / 1s subida) deixando 2–3 reps de sobra.`
        };
      }

      const allHitMax = lastRec.sets.length >= ex.sets && lastRec.sets.every(st => Number(st.reps) >= targetMax);
      const maxKg = Math.max(...lastRec.sets.map(st => Number(st.kg) || 0));

      if (allHitMax && maxKg > 0) {
        return {
          type: 'up',
          label: '⬆ Leve Aumento Seguro',
          text: `Você fechou ${targetMax} reps em todas! Se a postura esteve perfeita, suba apenas +1 a +2,5 kg (ou +1 placa leve) e faça ${activeOpt.repMin} reps limpas.`
        };
      }
      return {
        type: 'keep',
        label: '🎯 Consolidar Técnica',
        text: `Mantenha ${maxKg > 0 ? maxKg + ' kg' : 'a mesma placa'} e busque melhorar a postura ou somar +1 rep limpa até fechar ${targetMax} em todas.`
      };
    }

    function getTodayDietLog() {
      const key = getTodayKey();
      if (!state.dailyLogs[key]) {
        state.dailyLogs[key] = { waterMl: 0, mealsDone: {} };
      }
      return state.dailyLogs[key];
    }

    function getWeeklyCounts() {
      const startMs = getStartOfCurrentWeekMs();
      const hist = state.sessionHistory || [];
      let gym = 0;
      let volleyball = 0;
      hist.forEach(s => {
        const t = new Date(s.completedAt).getTime();
        if (!isNaN(t) && t >= startMs) {
          if (s.type === 'volleyball') volleyball++;
          else gym++;
        }
      });
      return { gym, volleyball };
    }

    /**
     * ============================================================================
     * SESSÃO GUIADA (INICIAR, PAUSAR, FINALIZAR) + REGISTRO DE VÔLEI
     * ============================================================================
     */
    function startGuidedSession(workoutId) {
      const workout = WORKOUTS[workoutId];
      if (!workout) return;

      const exercisesDraft = workout.exercises.map(ex => {
        const prefIdx = Number(state.preferredExVariant?.[ex.id]) || 0;
        const activeOpt = getActiveExerciseOption(ex, prefIdx);
        const lastRec = getLastRecordForExercise(ex.id, activeOpt.name);

        const sets = Array.from({ length: ex.sets }, (_, idx) => {
          const prevSet = lastRec?.sets?.[idx] || lastRec?.sets?.[lastRec.sets.length - 1];
          const defaultKg = activeOpt.isTimeBased ? 0 : (prevSet && prevSet.kg !== '' && prevSet.kg !== undefined ? Number(prevSet.kg) : '');
          const defaultReps = prevSet && prevSet.reps !== '' && prevSet.reps !== undefined && Boolean(lastRec.isTimeBased) === Boolean(activeOpt.isTimeBased)
            ? Number(prevSet.reps)
            : activeOpt.repMin;
          return { kg: defaultKg, reps: defaultReps, done: false };
        });

        return {
          exId: ex.id,
          variantIndex: prefIdx,
          usedSubstitute: prefIdx > 0,
          sets
        };
      });

      state.selectedWorkoutId = workoutId;
      state.activeSession = {
        workoutId,
        startedAt: new Date().toISOString(),
        resumedAt: Date.now(),
        accumulatedSec: 0,
        running: true,
        currentExIndex: 0,
        effort: 'Moderado', // 'Fácil' | 'Moderado' | 'Pesado'
        notes: '',
        exercises: exercisesDraft
      };

      ui.openGuideId = null;
      ui.inlineEmbedKey = null;
      ui.guidedViewAll = false;
      ensureRunningSessionTicker();
      persistState();
      renderApp();
      showToast(`▶ ${workout.name} iniciado! Postura bonita e controle!`, 'success');
    }

    function toggleSessionPause() {
      const s = state.activeSession;
      if (!s) return;
      if (s.running) {
        s.accumulatedSec = getSessionElapsedSec(s);
        s.running = false;
        s.resumedAt = null;
        clearInterval(ui.sessionTickInterval);
      } else {
        s.running = true;
        s.resumedAt = Date.now();
        ensureRunningSessionTicker();
      }
      persistState();
      renderApp();
    }

    function cancelActiveSession() {
      openModal({
        title: 'Descartar treino em andamento?',
        bodyHtml: '<p class="text-xs text-slate-300 leading-relaxed">As séries marcadas nesta sessão atual serão apagadas, mantendo todo o histórico anterior salvo.</p>',
        confirmText: 'Sim, descartar',
        cancelText: 'Continuar treinando',
        onConfirm: () => {
          clearInterval(ui.sessionTickInterval);
          stopRestTimer();
          state.activeSession = null;
          persistState();
          renderApp();
          showToast('Sessão descartada.', 'info');
        }
      });
    }

    function finishAndSaveSession() {
      const s = state.activeSession;
      if (!s) return;
      const workout = WORKOUTS[s.workoutId];
      if (!workout) return;

      const durationSec = getSessionElapsedSec(s);
      let totalSetsDone = 0;
      let totalVolumeKg = 0;

      const recordedExercises = workout.exercises.map((ex, idx) => {
        const draftEx = s.exercises[idx];
        const vIdx = typeof draftEx.variantIndex === 'number' ? draftEx.variantIndex : 0;
        const chosenOpt = getActiveExerciseOption(ex, vIdx);
        const cleanSets = draftEx.sets.map(st => {
          const kgNum = Number(st.kg) || 0;
          const repsNum = Number(st.reps) || 0;
          if (st.done) {
            totalSetsDone++;
            if (!chosenOpt.isTimeBased) {
              totalVolumeKg += kgNum * repsNum;
            }
          }
          return { kg: kgNum, reps: repsNum, done: Boolean(st.done) };
        });
        return {
          exId: ex.id,
          originalName: ex.name,
          executedName: chosenOpt.name,
          variantIndex: vIdx,
          usedSubstitute: vIdx > 0,
          isTimeBased: Boolean(chosenOpt.isTimeBased),
          sets: cleanSets
        };
      });

      if (totalSetsDone === 0) {
        showToast('Marque pelo menos 1 série concluída antes de finalizar.', 'error');
        return;
      }

      const newRecord = {
        id: 'gym_' + Date.now(),
        type: 'gym',
        workoutId: s.workoutId,
        workoutName: workout.name,
        workoutFocus: workout.focus,
        startedAt: s.startedAt,
        completedAt: new Date().toISOString(),
        durationSec,
        totalSetsDone,
        totalSetsPlanned: workout.exercises.reduce((acc, e) => acc + e.sets, 0),
        totalVolumeKg: Math.round(totalVolumeKg),
        effort: s.effort || 'Moderado',
        notes: (s.notes || '').trim(),
        exercises: recordedExercises
      };

      clearInterval(ui.sessionTickInterval);
      stopRestTimer();

      state.sessionHistory.unshift(newRecord);
      state.activeSession = null;
      const nextRecId = getRecommendedWorkoutId();
      state.selectedWorkoutId = nextRecId;
      persistState();
      renderApp();

      const effortBadge = newRecord.effort === 'Fácil'
        ? 'bg-teal-500/20 text-teal-300 border-teal-500/40'
        : newRecord.effort === 'Pesado'
          ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
          : 'bg-violet-500/20 text-violet-300 border-violet-500/40';

      openModal({
        title: `🎉 ${newRecord.workoutName} Concluído!`,
        bodyHtml: `
          <div class="space-y-3.5">
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-3">
                <div class="text-[10px] font-bold uppercase text-slate-400">Duração</div>
                <div class="text-lg font-black text-white tabular-nums mt-0.5">${formatMMSS(newRecord.durationSec)}</div>
              </div>
              <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-3">
                <div class="text-[10px] font-bold uppercase text-slate-400">Séries</div>
                <div class="text-lg font-black text-teal-400 tabular-nums mt-0.5">${newRecord.totalSetsDone}/${newRecord.totalSetsPlanned}</div>
              </div>
              <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-3">
                <div class="text-[10px] font-bold uppercase text-slate-400">Volume</div>
                <div class="text-lg font-black text-violet-300 tabular-nums mt-0.5">${newRecord.totalVolumeKg.toLocaleString('pt-BR')} kg</div>
              </div>
            </div>

            <div class="flex items-center justify-between bg-[#0b1120] border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs">
              <span class="font-bold text-slate-400">Sensação de esforço:</span>
              <span class="px-2.5 py-0.5 rounded-full font-extrabold border ${effortBadge}">${escapeHtml(newRecord.effort)}</span>
            </div>

            ${newRecord.effort === 'Pesado' ? `
              <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/35 text-amber-200 text-xs leading-relaxed">
                🛡️ <strong>Lembrete seguro:</strong> se o treino pareceu pesado demais, na próxima sessão mantenha a mesma carga (ou reduza 1 placa) para manter sempre 2–3 reps de sobra com técnica perfeita.
              </div>
            ` : ''}

            <button type="button" id="btnShareJustSaved" class="w-full py-3 px-4 rounded-xl text-xs font-black bg-[#0b1120] hover:bg-slate-900 text-teal-300 border border-teal-500/40 flex items-center justify-center gap-2 active:scale-95">
              <span>📤</span>
              <span>Compartilhar Resumo do Treino</span>
            </button>

            <div class="p-3 rounded-xl bg-[#0b1120] border border-slate-800 flex items-center justify-between gap-2">
              <div>
                <div class="text-[10px] font-bold uppercase text-slate-400">Próximo Sugerido na Fila</div>
                <div class="text-xs sm:text-sm font-extrabold text-white">${WORKOUTS[nextRecId].name} — ${WORKOUTS[nextRecId].shortFocus}</div>
              </div>
              <span class="px-2.5 py-1 rounded-lg text-xs font-black bg-[#8b5cf6] text-white">${nextRecId}</span>
            </div>
          </div>
        `,
        confirmText: 'Ver Evolução',
        cancelText: 'Fechar',
        onConfirm: () => switchTab('evolucao')
      });

      const shareBtn = document.getElementById('btnShareJustSaved');
      if (shareBtn) shareBtn.addEventListener('click', () => shareSessionSummary(newRecord));
    }

    function openLogVolleyballModal() {
      let chosenEffort = 'Moderado';
      openModal({
        title: '🏐 Registrar Treino de Vôlei',
        bodyHtml: `
          <div class="space-y-3.5 text-xs">
            <p class="text-slate-300 leading-relaxed">
              Registre sua aula/treino de vôlei para somar na meta semanal (<strong>2 vôleis + 4 musculações</strong>).
            </p>
            <div class="grid grid-cols-2 gap-2.5">

                <label class="block text-[11px] font-bold text-slate-400 mb-1">Sensação de esforço</label>

        confirmText: 'Salvar Vôlei',
        cancelText: 'Cancelar',
        onConfirm: () => {
          const mins = Math.max(10, Number(document.getElementById('vDurInp')?.value) || 40);
          const note = (document.getElementById('vNoteInp')?.value || '').trim();
          state.sessionHistory.unshift({
            id: 'vol_' + Date.now(),
            type: 'volleyball',
            workoutId: 'V',
            workoutName: 'Treino de Vôlei',
            workoutFocus: 'Quadra · Agilidade, Saltos & Fundamentos',
            completedAt: new Date().toISOString(),
            durationSec: mins * 60,
            effort: chosenEffort,
            notes: note
          });
          persistState();
          renderApp();
          showToast(`🏐 Treino de Vôlei (${mins} min) registrado!`, 'success');
        }
      });

      document.querySelectorAll('[data-veff]').forEach(btn => {
        btn.addEventListener('click', () => {
          chosenEffort = btn.dataset.veff;
          document.querySelectorAll('[data-veff]').forEach(b => {
            const act = b.dataset.veff === chosenEffort;
            b.className = `py-2.5 rounded-xl text-[11px] font-bold border transition-all ${
              act ? 'bg-violet-500 text-white border-violet-400' : 'bg-[#0b1120] text-slate-300 border-slate-700'
            }`;
          });
        });
      });
    }

        return `

            <div class="aspect-video w-full rounded-xl overflow-hidden bg-black border border-slate-700">
              <iframe
                class="w-full h-full"
                src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0"
                title="Execução: ${escapeHtml(activeOpt.name)}"
                frameborder="0"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

              </iframe>
            </div>
            <div class="flex items-center justify-between gap-2">
              <button type="button" data-close-inline-vid="1" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-[#111c33] text-slate-300 border border-slate-700">

            </div>

      return `

          <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener noreferrer" class="group relative block aspect-video w-full rounded-xl overflow-hidden bg-gradient-to-br from-slate-900 via-[#111c33] to-violet-950/60 border border-slate-700/90">

                          <span class="font-bold text-violet-300">${ex.sets}× ${activeOpt.repLabel}</span>
                          <span>⏱ ${ex.restSec}s</span>
                          <span class="text-teal-300/90">Último: ${lastSummary}</span>
                        </div>
                      </div>
                      <button type="button" data-toggle-guide="${ex.id}" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold border shrink-0 transition-all active:scale-95 ${
                        guideOpen
                          ? 'bg-[#8b5cf6] text-white border-violet-400'
                          : 'bg-[#111c33] text-teal-300 border-slate-700 hover:border-teal-500/50'
                      }">
                        🎥 ${guideOpen ? 'Fechar' : 'Vídeo'}
                      </button>
                    </div>

                    <!-- Faixa Inline de Substitutas em 1 Toque -->
                    ${renderInlineExerciseSubStrip(ex, prefIdx, 'lobby', ex.id)}

                    ${guideOpen ? renderExerciseGuideAccordion(ex, prefIdx) : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderGuidedSessionView() {
      const s = state.activeSession;
      const workout = WORKOUTS[s.workoutId];
      const elapsedSec = getSessionElapsedSec(s);
      const timePct = Math.min(100, Math.round((elapsedSec / (30 * 60)) * 100));

      let totalSets = 0;
      let doneSets = 0;
      s.exercises.forEach(ex => {
        ex.sets.forEach(st => {
          totalSets++;
          if (st.done) doneSets++;
        });
      });

      const currentExIdx = Math.max(0, Math.min(workout.exercises.length - 1, s.currentExIndex || 0));

      return `
        <div class="space-y-4 animate-in">
          <!-- Barra Superior Fixa da Sessão Ativa -->
          <section class="sticky top-[58px] z-20 bg-[#111c33]/95 backdrop-blur-md border border-violet-500/45 rounded-2xl p-3.5 space-y-2.5 shadow-xl">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full ${s.running ? 'bg-[#14b8a6] animate-pulse' : 'bg-amber-400'}"></span>
                  <span class="text-xs font-black uppercase tracking-wider text-violet-300">${workout.name} em andamento</span>
                </div>
                <p class="text-[11px] text-slate-400 truncate mt-0.5">${workout.shortFocus} · Meta 30:00</p>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <span id="sessionTimerDisplay" class="px-2.5 py-1.5 rounded-xl bg-[#0b1120] border border-slate-700 text-sm sm:text-base font-black text-white tabular-nums">${formatMMSS(elapsedSec)}</span>
                <button type="button" id="btnPauseSession" class="px-2.5 py-2 rounded-xl text-xs font-bold bg-[#0b1120] text-slate-200 border border-slate-700 active:scale-95" title="Pausar/Retomar">
                  ${s.running ? '⏸' : '▶'}
                </button>
                <button type="button" id="btnTopFinishQuick" class="px-2.5 py-2 rounded-xl text-xs font-black bg-[#14b8a6] text-[#0b1120] active:scale-95" title="Finalizar treino">
                  ✔ Salvar
                </button>
                <button type="button" id="btnCancelSession" class="px-2 py-2 rounded-xl text-xs font-bold bg-rose-500/15 text-rose-300 border border-rose-500/35 active:scale-95" title="Descartar sessão">
                  ✕
                </button>
              </div>
            </div>

            <div class="space-y-1">
              <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400">
                <span>Séries concluídas: <strong class="text-teal-300">${doneSets}/${totalSets}</strong></span>
                <button type="button" id="btnToggleKgStep" class="text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-[#0b1120] text-violet-300 border border-violet-500/35">
                  Passo carga: ±${state.kgStepSize} kg
                </button>
              </div>
              <div class="w-full h-2 bg-[#0b1120] rounded-full overflow-hidden">
                <div id="sessionTimeBar" class="h-full bg-gradient-to-r from-[#8b5cf6] to-[#14b8a6] transition-all duration-500" style="width: ${timePct}%"></div>
              </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-0.5">
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                ${workout.exercises.map((ex, idx) => {
                  const exDone = s.exercises[idx].sets.every(st => st.done);
                  const active = !ui.guidedViewAll && idx === currentExIdx;
                  return `
                    <button type="button" data-jump-ex="${idx}" class="w-9 h-9 rounded-xl text-xs font-black border-2 shrink-0 transition-all ${
                      active
                        ? 'bg-[#8b5cf6] text-white border-violet-300'
                        : exDone
                          ? 'bg-teal-500/20 text-teal-300 border-teal-500/50'
                          : 'bg-[#0b1120] text-slate-300 border-slate-700'
                    }">${exDone ? '✓' : idx + 1}</button>
                  `;
                }).join('')}
              </div>

              <button type="button" id="btnToggleGuidedAll" class="px-3 py-2 rounded-xl text-[11px] font-bold bg-[#0b1120] text-teal-300 border border-slate-700 shrink-0 active:scale-95">
                ${ui.guidedViewAll ? '1 por vez' : 'Ver todos'}
              </button>
            </div>
          </section>

          <!-- Exercício(s) da Sessão -->
          <div class="space-y-4">
            ${ui.guidedViewAll
              ? workout.exercises.map((ex, idx) => renderGuidedExerciseCard(ex, idx, s.exercises[idx], workout.exercises.length)).join('')
              : renderGuidedExerciseCard(workout.exercises[currentExIdx], currentExIdx, s.exercises[currentExIdx], workout.exercises.length)
            }
          </div>

          ${!ui.guidedViewAll ? `
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" id="btnPrevEx" ${currentExIdx === 0 ? 'disabled' : ''} class="py-3 rounded-xl text-xs font-extrabold bg-[#111c33] border border-slate-700 text-slate-200 disabled:opacity-35 active:scale-95">
                ← Exercício Anterior
              </button>
              <button type="button" id="btnNextEx" ${currentExIdx >= workout.exercises.length - 1 ? 'disabled' : ''} class="py-3 rounded-xl text-xs font-extrabold bg-[#111c33] border border-violet-500/45 text-violet-300 disabled:opacity-35 active:scale-95">
                Próximo Exercício →
              </button>
            </div>
          ` : ''}

          <!-- Sensação de Esforço + Observações + Finalizar -->
          <section class="bg-[#111c33] border border-slate-800 rounded-2xl p-4 space-y-3.5">
            <div class="space-y-1.5">
              <label class="block text-xs font-bold text-slate-300">Como você sentiu o esforço deste treino?</label>
              <div class="grid grid-cols-3 gap-2">
                ${[
                  { id: 'Fácil', emoji: '😊', sub: 'Bem leve' },
                  { id: 'Moderado', emoji: '💪', sub: 'Ideal (2–3 sobra)' },
                  { id: 'Pesado', emoji: '🔥', sub: 'Exigente' }

                  const act = (s.effort || 'Moderado') === ef.id;
                  return `
                    <button type="button" data-sess-effort="${ef.id}" class="p-2.5 rounded-xl border-2 text-center transition-all active:scale-95 ${
                      act
                        ? 'bg-violet-500/20 border-[#8b5cf6] text-white'
                        : 'bg-[#0b1120] border-slate-800 text-slate-400 hover:border-slate-700'
                    }">
                      <div class="text-base leading-none">${ef.emoji}</div>
                      <div class="text-xs font-extrabold mt-1">${ef.id}</div>
                      <div class="text-[10px] text-slate-400">${ef.sub}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div>
              <label for="sessionNotesInput" class="block text-xs font-bold text-slate-300 mb-1.5">Observações do treino (opcional)</label>
              <input id="sessionNotesInput" type="text" value="${escapeHtml(s.notes || '')}" placeholder="Ex.: Banco no ajuste 3, postura super firme..." class="w-full px-3.5 py-2.5 rounded-xl bg-[#0b1120] border border-slate-700 text-sm text-white focus:outline-none focus:border-violet-500" />
            </div>

            <button type="button" id="btnFinishSession" class="w-full py-4 px-5 rounded-2xl text-sm sm:text-base font-black bg-gradient-to-r from-[#8b5cf6] to-[#14b8a6] hover:brightness-110 text-[#0b1120] shadow-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
              <span>✔</span>
              <span>Finalizar e Salvar Treino (${doneSets}/${totalSets} séries)</span>
            </button>
          </section>
        </div>
      `;
    }

    function renderGuidedExerciseCard(ex, exIndex, draftEx, totalExercises) {
      const vIdx = typeof draftEx.variantIndex === 'number' ? draftEx.variantIndex : 0;
      const activeOpt = getActiveExerciseOption(ex, vIdx);
      const lastRec = getLastRecordForExercise(ex.id, activeOpt.name);
      const prog = getSafeProgressionSuggestion(ex, activeOpt, lastRec);
      const guideOpen = ui.openGuideId === ex.id;
      const isTime = Boolean(activeOpt.isTimeBased);
      const stepKg = state.kgStepSize || 1;

      return `
        <article class="bg-[#111c33] border border-slate-700/90 rounded-2xl p-4 space-y-3.5 shadow-lg">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-black px-2 py-0.5 rounded-md bg-[#8b5cf6] text-white">Exercício ${exIndex + 1} de ${totalExercises}</span>
                ${vIdx > 0 ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-teal-500/20 text-teal-300 border border-teal-500/40">🔄 Substituta</span>' : ''}
              </div>
              <button type="button" data-toggle-guide="${ex.id}" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition-all active:scale-95 ${
                guideOpen
                  ? 'bg-[#8b5cf6] text-white border-violet-400'
                  : 'bg-[#0b1120] text-teal-300 border-teal-500/35'
              }">
                🎥 ${guideOpen ? 'Fechar Vídeo' : 'Vídeo & Dica'}
              </button>
            </div>

            <h3 class="text-base sm:text-lg font-black text-white leading-snug">${escapeHtml(activeOpt.name)}</h3>

            <div class="flex flex-wrap items-center gap-2 text-xs font-semibold">
              <span class="text-violet-300">${ex.sets} séries × ${activeOpt.repLabel}</span>
              <span class="text-slate-600">•</span>
              <span class="text-teal-300">⏱ Descanso ${ex.restSec}s</span>
            </div>

            <!-- Substitutos em 1 toque dentro do Treino Guiado -->
            ${renderInlineExerciseSubStrip(ex, vIdx, 'session', exIndex)}

            <!-- Referência Anterior + Progressão Segura -->
            <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-3 space-y-1.5 text-xs">
              <div class="flex items-center justify-between gap-2 flex-wrap">
                <span class="text-[11px] font-bold text-slate-400">
                  📌 Última vez:
                  <strong class="text-slate-200">
                    ${lastRec ? lastRec.sets.map(st => isTime ? `${st.reps}s` : `${st.kg}kg×${st.reps}`).join(' · ') : 'Primeiro registro'}
                  </strong>
                </span>
                ${lastRec ? `<span class="text-[10px] text-slate-500">${formatShortDate(lastRec.date)}</span>` : ''}
              </div>
              <div class="flex items-start gap-1.5 pt-1 border-t border-slate-800/80 ${prog.type === 'up' ? 'text-teal-300' : 'text-violet-300'}">
                <span class="font-extrabold shrink-0">${prog.label}:</span>
                <span class="text-slate-300 leading-snug">${prog.text}</span>
              </div>
            </div>
          </div>

          ${guideOpen ? renderExerciseGuideAccordion(ex, vIdx) : ''}

          <!-- Checklist Interativo de Séries -->
          <div class="space-y-2">
            <div class="grid grid-cols-12 gap-1.5 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">
              <span class="col-span-2">Série</span>
              <span class="col-span-4 text-center">${isTime ? 'Tipo' : 'Carga (kg)'}</span>
              <span class="col-span-4 text-center">${isTime ? 'Segundos' : 'Reps'}</span>
              <span class="col-span-2 text-center">Feito</span>
            </div>

            ${draftEx.sets.map((st, sIdx) => `
              <div class="grid grid-cols-12 gap-1.5 items-center p-2 rounded-xl border transition-all ${
                st.done
                  ? 'bg-teal-500/12 border-teal-500/50'
                  : 'bg-[#0b1120] border-slate-800'
              }">
                <div class="col-span-2 flex items-center">
                  <span class="w-7 h-7 rounded-lg text-xs font-black flex items-center justify-center ${
                    st.done ? 'bg-[#14b8a6] text-[#0b1120]' : 'bg-slate-800 text-slate-300'
                  }">S${sIdx + 1}</span>
                </div>

                ${isTime ? `
                  <div class="col-span-4 flex items-center justify-center">
                    <button type="button" data-plank-timer="${Number(st.reps) || 35}" class="w-full h-9 rounded-lg bg-violet-500/15 border border-violet-500/35 text-[11px] font-extrabold text-violet-200 active:scale-95">
                      ⏱ Contar ${Number(st.reps) || 35}s
                    </button>
                  </div>
                ` : `
                  <div class="col-span-4 flex items-center gap-1">
                    <button type="button" data-kg-step="${exIndex}:${sIdx}:-${stepKg}" class="w-7 h-9 rounded-lg bg-slate-800 text-slate-200 font-black text-sm active:scale-90">−</button>
                    <input type="number" step="0.5" inputmode="decimal" data-kg-inp="${exIndex}:${sIdx}" value="${st.kg}" placeholder="0" class="w-full h-9 text-center rounded-lg bg-[#111c33] border border-slate-700 text-xs font-black text-white tabular-nums focus:outline-none focus:border-violet-500" />
                    <button type="button" data-kg-step="${exIndex}:${sIdx}:${stepKg}" class="w-7 h-9 rounded-lg bg-slate-800 text-slate-200 font-black text-sm active:scale-90">+</button>
                  </div>
                `}

                <div class="col-span-4 flex items-center gap-1">
                  <button type="button" data-rep-step="${exIndex}:${sIdx}:${isTime ? -5 : -1}" class="w-7 h-9 rounded-lg bg-slate-800 text-slate-200 font-black text-sm active:scale-90">−</button>
                  <input type="number" inputmode="numeric" data-rep-inp="${exIndex}:${sIdx}" value="${st.reps}" placeholder="${activeOpt.repMin}" class="w-full h-9 text-center rounded-lg bg-[#111c33] border border-slate-700 text-xs font-black text-white tabular-nums focus:outline-none focus:border-violet-500" />
                  <button type="button" data-rep-step="${exIndex}:${sIdx}:${isTime ? 5 : 1}" class="w-7 h-9 rounded-lg bg-slate-800 text-slate-200 font-black text-sm active:scale-90">+</button>
                </div>

                <div class="col-span-2 flex justify-center">
                  <button type="button" data-set-done="${exIndex}:${sIdx}" class="w-10 h-10 rounded-xl font-black text-base flex items-center justify-center border-2 transition-all active:scale-90 ${
                    st.done
                      ? 'bg-[#14b8a6] text-[#0b1120] border-teal-300 shadow-md shadow-teal-500/30'
                      : 'bg-[#111c33] text-slate-500 border-slate-700 hover:border-teal-500/60'
                  }">✓</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="flex items-center justify-between pt-1">
            ${!isTime ? `
              <button type="button" data-copy-first-set="${exIndex}" class="text-[11px] font-bold text-violet-300 hover:underline">
                📋 Repetir carga da S1
              </button>
            ` : `<span class="text-[11px] text-slate-500">Peso corporal · Controle postural</span>`}
            <button type="button" data-manual-rest="${ex.restSec}" class="text-[11px] font-bold text-teal-300 hover:underline">
              ⏱ Descanso (${ex.restSec}s)
            </button>
          </div>
        </article>
      `;
    }

    function applyExerciseSubstitute(mode, refKey, chosenIdx, fixDefault = false) {
      let ex = null;
      if (mode === 'session' && state.activeSession) {
        const exIndex = Number(refKey);
        const workout = WORKOUTS[state.activeSession.workoutId];
        ex = workout?.exercises?.[exIndex];
        if (ex && state.activeSession.exercises[exIndex]) {
          const prevOpt = getActiveExerciseOption(ex, state.activeSession.exercises[exIndex].variantIndex || 0);
          const nextOpt = getActiveExerciseOption(ex, chosenIdx);
          state.activeSession.exercises[exIndex].variantIndex = chosenIdx;
          state.activeSession.exercises[exIndex].usedSubstitute = chosenIdx > 0;
          // Se alternou entre tempo (Prancha) e repetições (Máquina), ajusta valores das séries não feitas
          if (Boolean(prevOpt.isTimeBased) !== Boolean(nextOpt.isTimeBased)) {
            state.activeSession.exercises[exIndex].sets.forEach(st => {
              if (!st.done) {
                st.kg = nextOpt.isTimeBased ? 0 : '';
                st.reps = nextOpt.repMin;
              }
            });
          }
          if (fixDefault) state.preferredExVariant[ex.id] = chosenIdx;
        }
      } else {
        ex = ALL_EXERCISES.find(e => e.id === refKey);
        if (ex) state.preferredExVariant[ex.id] = chosenIdx;
      }
      if (!ex) return;
      ui.inlineEmbedKey = null;
      const opt = getActiveExerciseOption(ex, chosenIdx);
      persistState();
      renderApp();
      showToast(`🔄 Selecionado: ${opt.name}`, 'success');
    }

    function openExerciseSubPicker(mode, refKey) {
      let ex = null;
      let currentIdx = 0;

      if (mode === 'session' && state.activeSession) {
        const idx = Number(refKey);
        ex = WORKOUTS[state.activeSession.workoutId]?.exercises?.[idx];
        const draft = state.activeSession.exercises[idx];
        currentIdx = typeof draft?.variantIndex === 'number' ? draft.variantIndex : 0;
      } else {
        ex = ALL_EXERCISES.find(e => e.id === refKey);
        currentIdx = Number(state.preferredExVariant?.[refKey]) || 0;
      }
      if (!ex) return;

      const variants = getExerciseVariants(ex);

      openModal({
        title: `🔄 Substitutos — ${ex.shortName || ex.name}`,
        bodyHtml: `
          <div class="space-y-3">
            <p class="text-xs text-slate-400 leading-relaxed">
              Escolha a máquina/opção disponível na academia. O vídeo, as dicas e o histórico se ajustam na hora:
            </p>
            <div class="space-y-2.5">
              ${variants.map((v, idx) => {
                const isSelected = idx === currentIdx;
                return `
                  <div class="rounded-xl border-2 p-3 transition-all ${
                    isSelected ? 'bg-violet-500/12 border-[#8b5cf6]' : 'bg-[#0b1120] border-slate-800'
                  }">
                    <div class="flex items-start justify-between gap-2">
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-md ${
                            v.isPrincipal ? 'bg-violet-500/20 text-violet-300' : 'bg-teal-500/20 text-teal-300'
                          }">${v.isPrincipal ? 'Padrão' : `Substituto ${idx}`}</span>
                          <span class="text-[10px] font-bold text-slate-400">${ex.sets}× ${v.repLabel}</span>
                          ${isSelected ? '<span class="text-[10px] font-bold text-teal-300">✓ Em uso</span>' : ''}
                        </div>
                        <div class="text-sm font-extrabold text-white mt-1">${escapeHtml(v.name)}</div>
                        <div class="text-[11px] text-slate-400 mt-0.5 leading-snug">${escapeHtml(v.note)}</div>
                      </div>
                      <a href="https://www.youtube.com/watch?v=${v.videoId}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-rose-600/20 text-rose-300 border border-rose-500/35 shrink-0">
                        🎥 Vídeo ↗
                      </a>
                    </div>
                    <div class="flex items-center gap-2 mt-2.5">
                      <button type="button" data-pick-ex-var="${idx}:once" class="flex-1 py-2 px-3 rounded-lg text-xs font-black active:scale-95 ${
                        isSelected ? 'bg-slate-800 text-slate-300' : 'bg-[#14b8a6] text-[#0b1120]'
                      }">
                        ${mode === 'session' ? (isSelected ? 'Em uso hoje' : 'Usar neste treino') : (isSelected ? 'Definido como padrão' : 'Selecionar')}
                      </button>
                      ${mode === 'session' && !isSelected ? `
                        <button type="button" data-pick-ex-var="${idx}:always" class="py-2 px-3 rounded-lg text-[11px] font-bold bg-[#111c33] text-violet-300 border border-violet-500/40 active:scale-95">
                          Fixar padrão
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `,
        hideConfirm: true,
        cancelText: 'Fechar'
      });

      document.querySelectorAll('[data-pick-ex-var]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [idxStr, scope] = btn.dataset.pickExVar.split(':');
          closeModal();
          applyExerciseSubstitute(mode, refKey, Number(idxStr), scope === 'always');
        });
      });
    }

    function bindTreinoEvents() {
      const safetyBtn = document.getElementById('btnToggleSafety');
      if (safetyBtn) {
        safetyBtn.addEventListener('click', () => {
          state.safetyBannerCollapsed = !state.safetyBannerCollapsed;
          persistState();
          renderApp();
        });
      }

      const volBtn = document.getElementById('btnLogVolleyball');
      if (volBtn) volBtn.addEventListener('click', openLogVolleyballModal);

      document.querySelectorAll('[data-select-workout]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedWorkoutId = btn.dataset.selectWorkout;
          ui.openGuideId = null;
          ui.inlineEmbedKey = null;
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-start-workout]').forEach(btn => {
        btn.addEventListener('click', () => startGuidedSession(btn.dataset.startWorkout));
      });

      document.querySelectorAll('[data-toggle-guide]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.toggleGuide;
          ui.openGuideId = ui.openGuideId === id ? null : id;
          ui.inlineEmbedKey = null;
          renderApp();
        });
      });

      document.querySelectorAll('[data-open-inline-vid]').forEach(btn => {
        btn.addEventListener('click', () => {
          ui.inlineEmbedKey = btn.dataset.openInlineVid;
          renderApp();
        });
      });

      document.querySelectorAll('[data-close-inline-vid]').forEach(btn => {
        btn.addEventListener('click', () => {
          ui.inlineEmbedKey = null;
          renderApp();
        });
      });

      document.querySelectorAll('[data-quick-ex-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [mode, refKey, idxStr] = btn.dataset.quickExSub.split(':');
          applyExerciseSubstitute(mode, refKey, Number(idxStr), false);
        });
      });

      document.querySelectorAll('[data-open-ex-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [mode, refKey] = btn.dataset.openExSub.split(':');
          openExerciseSubPicker(mode, refKey);
        });
      });

      const pauseBtn = document.getElementById('btnPauseSession');
      if (pauseBtn) pauseBtn.addEventListener('click', toggleSessionPause);

      const cancelBtn = document.getElementById('btnCancelSession');
      if (cancelBtn) cancelBtn.addEventListener('click', cancelActiveSession);

      const finishBtn = document.getElementById('btnFinishSession');
      if (finishBtn) finishBtn.addEventListener('click', finishAndSaveSession);

      const topFinish = document.getElementById('btnTopFinishQuick');
      if (topFinish) topFinish.addEventListener('click', finishAndSaveSession);

      const kgStepBtn = document.getElementById('btnToggleKgStep');
      if (kgStepBtn) {
        kgStepBtn.addEventListener('click', () => {
          state.kgStepSize = state.kgStepSize === 1 ? 2.5 : 1;
          persistState();
          renderApp();
          showToast(`Ajuste dos botões alterado para ±${state.kgStepSize} kg.`, 'info');
        });
      }

      const toggleAllBtn = document.getElementById('btnToggleGuidedAll');
      if (toggleAllBtn) {
        toggleAllBtn.addEventListener('click', () => {
          ui.guidedViewAll = !ui.guidedViewAll;
          renderApp();
        });
      }

      document.querySelectorAll('[data-jump-ex]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!state.activeSession) return;
          state.activeSession.currentExIndex = Number(btn.dataset.jumpEx);
          ui.guidedViewAll = false;
          persistState();
          renderApp();
        });
      });

      const prevEx = document.getElementById('btnPrevEx');
      if (prevEx) {
        prevEx.addEventListener('click', () => {
          if (state.activeSession && state.activeSession.currentExIndex > 0) {
            state.activeSession.currentExIndex--;
            persistState();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      }

      const nextEx = document.getElementById('btnNextEx');
      if (nextEx) {
        nextEx.addEventListener('click', () => {
          if (!state.activeSession) return;
          const max = WORKOUTS[state.activeSession.workoutId].exercises.length - 1;
          if (state.activeSession.currentExIndex < max) {
            state.activeSession.currentExIndex++;
            persistState();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      }

      document.querySelectorAll('[data-kg-step]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [exI, sI, delta] = btn.dataset.kgStep.split(':').map(Number);
          const st = state.activeSession?.exercises?.[exI]?.sets?.[sI];
          if (!st) return;
          st.kg = Math.max(0, Math.round(((Number(st.kg) || 0) + delta) * 10) / 10);
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-kg-inp]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const [exI, sI] = inp.dataset.kgInp.split(':').map(Number);
          const st = state.activeSession?.exercises?.[exI]?.sets?.[sI];
          if (st) { st.kg = e.target.value; persistState(); }
        });
      });

      document.querySelectorAll('[data-rep-step]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [exI, sI, delta] = btn.dataset.repStep.split(':').map(Number);
          const st = state.activeSession?.exercises?.[exI]?.sets?.[sI];
          if (!st) return;
          st.reps = Math.max(0, (Number(st.reps) || 0) + delta);
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-rep-inp]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const [exI, sI] = inp.dataset.repInp.split(':').map(Number);
          const st = state.activeSession?.exercises?.[exI]?.sets?.[sI];
          if (st) { st.reps = e.target.value; persistState(); }
        });
      });

      document.querySelectorAll('[data-plank-timer]').forEach(btn => {
        btn.addEventListener('click', () => startRestTimer(Number(btn.dataset.plankTimer) || 35, 'Prancha'));
      });

      document.querySelectorAll('[data-set-done]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [exI, sI] = btn.dataset.setDone.split(':').map(Number);
          const s = state.activeSession;
          const st = s?.exercises?.[exI]?.sets?.[sI];
          if (!st) return;
          st.done = !st.done;
          if (st.done) {
            const exDef = WORKOUTS[s.workoutId].exercises[exI];
            startRestTimer(exDef.restSec, 'Descanso');
          }
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-copy-first-set]').forEach(btn => {
        btn.addEventListener('click', () => {
          const exI = Number(btn.dataset.copyFirstSet);
          const sets = state.activeSession?.exercises?.[exI]?.sets;
          if (!sets || sets.length < 2) return;
          const baseKg = sets[0].kg;
          sets.forEach((st, idx) => { if (idx > 0) st.kg = baseKg; });
          persistState();
          renderApp();
          showToast(`Carga ${baseKg || 0} kg copiada para as outras séries.`, 'info');
        });
      });

      document.querySelectorAll('[data-manual-rest]').forEach(btn => {
        btn.addEventListener('click', () => startRestTimer(Number(btn.dataset.manualRest), 'Descanso'));
      });

      document.querySelectorAll('[data-sess-effort]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!state.activeSession) return;
          state.activeSession.effort = btn.dataset.sessEffort;
          persistState();
          renderApp();
        });
      });

      const notesInp = document.getElementById('sessionNotesInput');
      if (notesInp) {
        notesInp.addEventListener('input', (e) => {
          if (state.activeSession) { state.activeSession.notes = e.target.value; persistState(); }
        });
      }
    }

    /**
     * ============================================================================
     * ABA 2: DIETA & NUTRIÇÃO (0% SUPLEMENTOS, CRESCIMENTO SAUDÁVEL, 1 TOQUE)
     * ============================================================================
     */
    function getDisplayedFoodText(item) {
      const sel = state.mealSubs[item.id];
      if (typeof sel === 'string' && sel.startsWith('custom:')) {
        return { text: sel.slice(7), isSub: true, isCustom: true, subIdx: -2 };
      }
      if (typeof sel === 'number' && sel >= 0 && item.subs[sel]) {
        return { text: item.subs[sel].text, isSub: true, isCustom: false, subIdx: sel };
      }
      return { text: item.baseText, isSub: false, isCustom: false, subIdx: -1 };
    }

    function renderDietaTab() {
      const modeObj = DIET_MODES[state.dietMode] || DIET_MODES.base;
      const todayLog = getTodayDietLog();

      let curKcal = 0, curP = 0, curC = 0, curG = 0, mealsDoneCount = 0;
      MEALS.forEach(m => {
        if (todayLog.mealsDone[m.id]) {
          const mm = m.macros[state.dietMode];
          curKcal += mm.kcal; curP += mm.p; curC += mm.c; curG += mm.g;
          mealsDoneCount++;
        }
      });

      const waterGoal = modeObj.waterGoalMl;
      const waterMl = todayLog.waterMl || 0;
      const waterCups = Math.floor(waterMl / 250);
      const totalGoalCups = Math.ceil(waterGoal / 250);
      const waterPct = Math.min(100, Math.round((waterMl / waterGoal) * 100));

      const macroBar = (label, cur, goal, unit, color) => {
        const pct = Math.min(100, Math.round((cur / goal) * 100));
        return `
          <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-2.5 space-y-1.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-slate-300">${label}</span>
              <span class="font-black text-white tabular-nums">${cur}<span class="text-slate-500 font-semibold">/${goal}${unit}</span></span>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full ${color} rounded-full transition-all" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      };

      return `
        <div class="space-y-4 animate-in">
          <!-- Aviso Educativo Pediátrico -->
          <section class="bg-teal-500/10 border border-teal-500/35 rounded-2xl p-3.5 text-xs text-teal-100 leading-relaxed">
            <strong class="text-teal-300">🌱 Alimentação para Crescimento e Massa Magra (12 anos):</strong>
            sem restrição severa e <strong>sem suplementos</strong> (Vitamina B12 já está alta em 1.020 pg/mL). Prioridade: <strong>Proteína em comida de verdade</strong>, <strong>Ferro + Vitamina C</strong> (Ferritina 33,5) e <strong>Cálcio</strong> para ossos fortes.
          </section>

          <!-- Seletor de 2 Modos Energéticos -->
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${Object.values(DIET_MODES).map(m => {
              const active = state.dietMode === m.id;
              return `
                <button type="button" data-diet-mode="${m.id}" class="text-left p-4 rounded-2xl border-2 transition-all ${
                  active
                    ? 'bg-violet-500/15 border-[#8b5cf6] shadow-lg shadow-violet-950/30'
                    : 'bg-[#111c33] border-slate-800 hover:border-slate-700'
                }">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full ${
                      active ? 'bg-[#8b5cf6] text-white' : 'bg-slate-800 text-slate-400'
                    }">${m.badge}</span>
                    <span class="text-sm font-black tabular-nums ${active ? 'text-teal-300' : 'text-white'}">${m.kcal.toLocaleString('pt-BR')} kcal</span>
                  </div>
                  <div class="text-sm font-extrabold text-white mt-1.5">${m.title}</div>
                  <p class="text-[11px] text-slate-400 mt-1 leading-snug">${m.desc}</p>
                  <div class="flex items-center gap-3 text-[11px] font-bold mt-2 tabular-nums">
                    <span class="text-violet-300">P ${m.p}g</span>
                    <span class="text-teal-300">C ${m.c}g</span>
                    <span class="text-amber-300">G ${m.g}g</span>
                  </div>
                </button>
              `;
            }).join('')}
          </section>

          <!-- Progresso Diário + Hidratação em Copos de 250 ml -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-3.5">
            <section class="lg:col-span-2 bg-[#111c33] border border-slate-800 rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <h3 class="text-sm font-extrabold text-white">Refeições Hoje (${mealsDoneCount}/4)</h3>
                <span class="text-[11px] font-bold text-slate-400">04:30 Acordar · 20:30 Dormir</span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                ${macroBar('Energia', curKcal, modeObj.kcal, ' kcal', 'bg-[#8b5cf6]')}
                ${macroBar('Proteína', curP, modeObj.p, 'g', 'bg-[#14b8a6]')}
                ${macroBar('Carboidratos', curC, modeObj.c, 'g', 'bg-amber-400')}
                ${macroBar('Gordura Boa', curG, modeObj.g, 'g', 'bg-sky-400')}
              </div>
            </section>

            <!-- Rastreador de Água (Copos de 250 ml) -->
            <section class="bg-[#111c33] border border-slate-800 rounded-2xl p-4 flex flex-col justify-between gap-3">
              <div>
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-teal-300">💧 Hidratação (Copos 250 ml)</span>
                  <span class="text-[11px] font-bold text-slate-400">Meta ${(waterGoal / 1000).toFixed(1).replace('.', ',')} L</span>
                </div>
                <div class="flex items-baseline justify-between mt-1">
                  <div class="text-2xl font-black text-white tabular-nums">
                    ${(waterMl / 1000).toFixed(2).replace('.', ',')} <span class="text-xs font-semibold text-slate-400">L</span>
                  </div>
                  <span class="text-xs font-bold text-teal-300">${waterCups}/${totalGoalCups} copos</span>
                </div>
                <div class="w-full h-2 bg-[#0b1120] rounded-full overflow-hidden mt-2">
                  <div class="h-full bg-[#14b8a6] rounded-full transition-all" style="width:${waterPct}%"></div>
                </div>
                <!-- Copinhos interativos -->
                <div class="flex flex-wrap gap-1 mt-2.5">
                  ${Array.from({ length: totalGoalCups }, (_, idx) => {
                    const filled = idx < waterCups;
                    return `<button type="button" data-set-cups="${idx + 1}" title="${(idx + 1) * 250} ml" class="w-6 h-6 rounded-lg text-[11px] flex items-center justify-center border transition-all ${
                      filled ? 'bg-teal-500/25 border-teal-400 text-teal-200' : 'bg-[#0b1120] border-slate-800 text-slate-600'
                    }">💧</button>`;
                  }).join('')}
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" data-water="-250" class="py-2 rounded-xl text-xs font-extrabold bg-[#0b1120] text-slate-300 border border-slate-700 active:scale-95">− 1 copo</button>
                <button type="button" data-water="250" class="py-2 rounded-xl text-xs font-extrabold bg-[#14b8a6] text-[#0b1120] active:scale-95">+ 1 copo (250ml)</button>
              </div>
            </section>
          </div>

          <!-- 4 Refeições com Chips de Substituição em 1 Toque + Modal Opções -->
          <div class="space-y-3.5">
            ${MEALS.map(meal => {
              const done = Boolean(todayLog.mealsDone[meal.id]);
              const mMacros = meal.macros[state.dietMode];
              const visibleItems = meal.items.filter(it => !it.onlyMode || it.onlyMode === state.dietMode);

              return `
                <article class="bg-[#111c33] border ${done ? 'border-teal-500/60' : 'border-slate-800'} rounded-2xl overflow-hidden transition-all">
                  <div class="p-3.5 bg-[#0b1120]/55 border-b border-slate-800/80 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[11px] font-black px-2 py-0.5 rounded-md bg-violet-500/20 text-violet-300 border border-violet-500/35">${meal.time}</span>
                        <h4 class="text-sm font-extrabold text-white truncate">${meal.title}</h4>
                      </div>
                      <div class="text-[11px] text-slate-400 font-semibold mt-1 tabular-nums">
                        ${mMacros.kcal} kcal · P ${mMacros.p}g · C ${mMacros.c}g · G ${mMacros.g}g
                      </div>
                    </div>
                    <button type="button" data-meal-done="${meal.id}" class="px-3 py-2 rounded-xl text-xs font-black shrink-0 border transition-all active:scale-95 ${
                      done
                        ? 'bg-[#14b8a6] text-[#0b1120] border-teal-300'
                        : 'bg-[#0b1120] text-slate-300 border-slate-700 hover:border-teal-500/50'
                    }">
                      ${done ? '✓ Feita' : 'Marcar'}
                    </button>
                  </div>

                  <div class="p-3.5 space-y-2.5">
                    ${meal.note ? `<div class="text-[11px] text-slate-300 bg-[#0b1120]/60 border border-slate-800 rounded-xl px-3 py-2 leading-snug">${meal.note}</div>` : ''}

                    ${visibleItems.map(item => {
                      const info = getDisplayedFoodText(item);
                      const borderClass = info.isSub
                        ? 'border-teal-500/50'
                        : item.highlight === 'violet'
                          ? 'border-violet-500/50 bg-violet-950/20'
                          : item.highlight === 'teal'
                            ? 'border-teal-500/35'
                            : 'border-slate-800';

                      return `
                        <div class="bg-[#0b1120]/90 border ${borderClass} rounded-xl p-3 space-y-2">
                          <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                              <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
                                <span class="text-[10px] font-bold uppercase tracking-wider ${item.highlight === 'violet' ? 'text-violet-300' : item.highlight === 'teal' ? 'text-teal-300' : 'text-slate-400'}">${item.tag}</span>
                                ${info.isSub ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-300">${info.isCustom ? 'Personalizado' : 'Substituído'}</span>` : ''}
                              </div>
                              <div class="text-xs sm:text-sm font-semibold ${info.isSub ? 'text-teal-100' : 'text-slate-100'} leading-snug">${escapeHtml(info.text)}</div>
                            </div>
                            <button type="button" data-open-meal-sub="${meal.id}:${item.id}" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-[#111c33] text-teal-300 border border-slate-700 hover:border-teal-500/50 shrink-0 active:scale-95">
                              🔄 Opções
                            </button>
                          </div>

                          <!-- Chips de Substituição em 1 Toque -->
                          <div class="flex flex-wrap items-center gap-1.5 pt-1.5 border-t border-slate-800/80">
                            <span class="text-[10px] font-bold text-slate-500 mr-0.5">Trocar:</span>
                            <button type="button" data-quick-meal-sub="${item.id}:-1" class="px-2 py-1 rounded-lg text-[10px] font-bold border transition-all active:scale-95 ${
                              !info.isSub ? 'bg-violet-500/20 text-violet-200 border-violet-400' : 'bg-[#111c33] text-slate-400 border-slate-800 hover:text-slate-200'
                            }">
                              ${!info.isSub ? '✓ ' : ''}Padrão
                            </button>
                            ${item.subs.map((sub, idx) => {
                              const act = info.subIdx === idx;
                              return `
                                <button type="button" data-quick-meal-sub="${item.id}:${idx}" class="px-2 py-1 rounded-lg text-[10px] font-bold border transition-all active:scale-95 ${
                                  act ? 'bg-teal-500/20 text-teal-200 border-teal-400' : 'bg-[#111c33] text-slate-400 border-slate-800 hover:text-slate-200'
                                }">
                                  ${act ? '✓ ' : ''}${escapeHtml(sub.short)}
                                </button>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openMealSubPicker(mealId, itemId) {
      const meal = MEALS.find(m => m.id === mealId);
      const item = meal?.items?.find(i => i.id === itemId);
      if (!meal || !item) return;

      const info = getDisplayedFoodText(item);

      openModal({
        title: `🔄 Substituir — ${item.tag}`,
        bodyHtml: `
          <div class="space-y-3">
            <p class="text-xs text-slate-400 leading-relaxed">
              Refeição ${meal.num}. Escolha uma substituição equivalente ou digite o que você comeu hoje:
            </p>
            <div class="space-y-2">
              <button type="button" data-pick-meal-sub="-1" class="w-full text-left p-3 rounded-xl border-2 transition-all active:scale-[0.99] ${
                !info.isSub ? 'bg-violet-500/15 border-[#8b5cf6]' : 'bg-[#0b1120] border-slate-800'
              }">
                <div class="flex items-center justify-between gap-2 mb-0.5">
                  <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-violet-500/20 text-violet-300">Opção Padrão</span>
                  ${!info.isSub ? '<span class="text-[11px] font-extrabold text-violet-300">✓ Selecionada</span>' : ''}
                </div>
                <div class="text-xs sm:text-sm font-bold text-white leading-snug">${escapeHtml(item.baseText)}</div>
              </button>

              ${item.subs.map((sub, idx) => {
                const active = info.subIdx === idx;
                return `
                  <button type="button" data-pick-meal-sub="${idx}" class="w-full text-left p-3 rounded-xl border-2 transition-all active:scale-[0.99] ${
                    active ? 'bg-teal-500/15 border-[#14b8a6]' : 'bg-[#0b1120] border-slate-800 hover:border-teal-500/40'
                  }">
                    <div class="flex items-center justify-between gap-2 mb-0.5">
                      <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-teal-500/20 text-teal-300">${escapeHtml(sub.short)}</span>
                      ${active ? '<span class="text-[11px] font-extrabold text-teal-300">✓ Em uso</span>' : ''}
                    </div>
                    <div class="text-xs sm:text-sm font-bold text-slate-100 leading-snug">${escapeHtml(sub.text)}</div>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="pt-2 border-t border-slate-800 space-y-2">
              <label for="customFoodInp" class="block text-[11px] font-bold text-slate-300">✏️ Ou digite uma troca personalizada:</label>
              <div class="flex gap-2">
                <input id="customFoodInp" type="text" value="${info.isCustom ? escapeHtml(info.text) : ''}" placeholder="Ex.: Crepioca com queijo e frango" class="flex-1 px-3 py-2 rounded-xl bg-[#0b1120] border border-slate-700 text-xs text-white focus:outline-none focus:border-teal-500" />
                <button type="button" id="btnSaveCustomFood" class="px-3.5 py-2 rounded-xl text-xs font-black bg-[#14b8a6] text-[#0b1120] shrink-0 active:scale-95">Usar</button>
              </div>
            </div>
          </div>
        `,
        hideConfirm: true,
        cancelText: 'Fechar'
      });

      document.querySelectorAll('[data-pick-meal-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = Number(btn.dataset.pickMealSub);
          state.mealSubs[item.id] = val;
          persistState();
          closeModal();
          renderApp();
          showToast(val === -1 ? 'Opção padrão restaurada.' : 'Alimento substituído!', 'success');
        });
      });

      const saveCustom = document.getElementById('btnSaveCustomFood');
      if (saveCustom) {
        saveCustom.addEventListener('click', () => {
          const val = (document.getElementById('customFoodInp')?.value || '').trim();
          if (!val) { showToast('Digite o alimento substituto.', 'error'); return; }
          state.mealSubs[item.id] = 'custom:' + val;
          persistState();
          closeModal();
          renderApp();
          showToast('Troca personalizada salva!', 'success');
        });
      }
    }

    function bindDietaEvents() {
      const todayLog = getTodayDietLog();

      document.querySelectorAll('[data-diet-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.dietMode = btn.dataset.dietMode;
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-water]').forEach(btn => {
        btn.addEventListener('click', () => {
          todayLog.waterMl = Math.max(0, Math.min(4500, (todayLog.waterMl || 0) + Number(btn.dataset.water)));
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-set-cups]').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetMl = Number(btn.dataset.setCups) * 250;
          todayLog.waterMl = todayLog.waterMl === targetMl ? Math.max(0, targetMl - 250) : targetMl;
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-meal-done]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.mealDone;
          todayLog.mealsDone[id] = !todayLog.mealsDone[id];
          persistState();
          renderApp();
        });
      });

      document.querySelectorAll('[data-quick-meal-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [itemId, idxStr] = btn.dataset.quickMealSub.split(':');
          state.mealSubs[itemId] = Number(idxStr);
          persistState();
          renderApp();

     * ABA 3: EVOLUÇÃO, META SEMANAL, GRÁFICO, HISTÓRICO, CORPO, EXAMES & BACKUP

    function renderLoadChartSVG(exId) {
      const exObj = ALL_EXERCISES.find(e => e.id === exId);
      const isTime = Boolean(exObj?.isTimeBased);
      const points = [];

      [...getGymHistory()].reverse().forEach(sess => {
        const found = (sess.exercises || []).find(e => e.exId === exId && e.sets.some(st => st.done));
        if (found) {
          const doneSets = found.sets.filter(st => st.done);
          const val = found.isTimeBased
            ? Math.max(...doneSets.map(st => Number(st.reps) || 0))
            : Math.max(...doneSets.map(st => Number(st.kg) || 0));
          points.push({ date: formatShortDate(sess.completedAt), val, unit: found.isTimeBased ? 's' : 'kg' });
        }
      });

      if (points.length === 0) {
        return `<div class="h-36 flex items-center justify-center text-xs text-slate-400 bg-[#0b1120] rounded-xl border border-slate-800 px-4 text-center">Conclua pelo menos 1 treino com este exercício para visualizar a evolução ${isTime ? 'de tempo (seg)' : 'de cargas (kg)'}.</div>`;
      }

      const W = 500, H = 150, padX = 36, padY = 22;
      const vals = points.map(p => p.val);
      const minV = Math.max(0, Math.min(...vals) - 4);
      const maxV = Math.max(...vals, minV + 8) + 4;
      const span = maxV - minV || 1;

      const coords = points.map((pt, i) => {
        const x = points.length === 1 ? W / 2 : padX + (i / (points.length - 1)) * (W - padX * 2);
        const y = H - padY - ((pt.val - minV) / span) * (H - padY * 2);
        return { ...pt, x, y };
      });

      const poly = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');

      return `
        <div class="bg-[#0b1120] border border-slate-800 rounded-xl p-2.5 overflow-hidden">
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-36">
            <line x1="${padX}" y1="${padY}" x2="${W - padX}" y2="${padY}" stroke="#1e293b" stroke-dasharray="4"/>
            <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="#1e293b"/>
            ${coords.length > 1 ? `<polyline fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>` : ''}
            ${coords.map(c => `
              <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="5" fill="#14b8a6" stroke="#0b1120" stroke-width="2"/>
              <text x="${c.x.toFixed(1)}" y="${(c.y - 10).toFixed(1)}" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="800">${c.val}${c.unit}</text>
              <text x="${c.x.toFixed(1)}" y="${H - 5}" text-anchor="middle" fill="#94a3b8" font-size="10">${c.date}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }
