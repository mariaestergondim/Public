      });

      const bodyForm = document.getElementById('bodyLogForm');
      if (bodyForm) {
        bodyForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const date = document.getElementById('bDate').value;
          const weight = Number(document.getElementById('bWeight').value);
          const height = Number(document.getElementById('bHeight').value);
          const bfRaw = document.getElementById('bBf').value;
          if (!date || !weight) return;
          state.bodyLogs.push({
            id: 'body_' + Date.now(),
            date,
            weight,
            height: height || 164,
            bf: bfRaw ? Number(bfRaw) : '',
            note: ''
          });
          persistState();
          renderApp();
          showToast('Registro de crescimento salvo!', 'success');
        });
      }

      document.querySelectorAll('[data-del-body]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.bodyLogs = state.bodyLogs.filter(b => b.id !== btn.dataset.delBody);
          persistState();
          renderApp();
        });
      });

      const shareRep = document.getElementById('btnShareWeeklyReport');
      if (shareRep) shareRep.addEventListener('click', shareWeeklyReport);

      const expJson = document.getElementById('btnExportJson');
      if (expJson) expJson.addEventListener('click', exportBackupJSON);

      const impJson = document.getElementById('btnImportJson');
      if (impJson) impJson.addEventListener('click', () => document.getElementById('importJsonInput').click());
    }

    /**
     * ============================================================================
     * COMPARTILHAMENTO NATIVO (FALLBACK EXEC_COMMAND), BACKUP JSON E GUIA CELULAR
     * ============================================================================
     */
    function copyTextFallback(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    async function shareOrCopyText(title, text) {
      if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
        try {
          await navigator.share({ title, text });
          showToast('Compartilhado com sucesso!', 'success');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      if (copyTextFallback(text)) {
        showToast('Resumo copiado! Agora basta colar no WhatsApp ou Notas.', 'success');
      } else {
        showToast('Não foi possível copiar automaticamente.', 'error');
      }
    }

    function shareSessionSummary(sess) {
      if (sess.type === 'volleyball') {
        const txt = [
          `🏐 Maria Ester — Treino de Vôlei`,
          `📅 ${formatShortDateTime(sess.completedAt)} | ⏱ ${Math.round((sess.durationSec || 2400) / 60)} min`,
          `💪 Esforço: ${sess.effort || 'Moderado'}`,
          sess.notes ? `📝 Obs: ${sess.notes}` : ''
        ].filter(Boolean).join('\n');
        shareOrCopyText('Treino de Vôlei — Maria Ester', txt);
        return;
      }

      const lines = [
        `🏋️ Maria Ester — ${sess.workoutName} (${sess.workoutFocus})`,
        `📅 ${formatShortDateTime(sess.completedAt)} | ⏱ ${formatMMSS(sess.durationSec)}`,
        `📊 ${sess.totalSetsDone}/${sess.totalSetsPlanned} séries | Volume: ${Number(sess.totalVolumeKg).toLocaleString('pt-BR')} kg | Esforço: ${sess.effort || 'Moderado'}`,
        ''
      ];
      (sess.exercises || []).forEach((ex, i) => {
        const setsTxt = ex.sets.filter(st => st.done).map(st =>
          ex.isTimeBased ? `${st.reps}s` : `${st.kg}kg×${st.reps}`
        ).join(', ') || 'não feito';
        lines.push(`${i + 1}. ${ex.executedName}: ${setsTxt}`);
      });
      if (sess.notes) lines.push(`\n📝 Obs: ${sess.notes}`);
      shareOrCopyText(`Treino Concluído — ${sess.workoutName}`, lines.join('\n'));
    }

    function shareWeeklyReport() {
      const week = getWeeklyCounts();
      const sortedBody = [...(state.bodyLogs || [])].sort((a, b) => a.date.localeCompare(b.date));
      const latest = sortedBody[sortedBody.length - 1] || { weight: 59.3, height: 164 };
      const todayDiet = getTodayDietLog();
      const mealsDone = Object.values(todayDiet.mealsDone || {}).filter(Boolean).length;
      const recent = state.sessionHistory.slice(0, 6);

      const lines = [
        `📋 Relatório Semanal — Maria Ester Fit (12 anos)`,
        `📅 Gerado em ${formatShortDate(getTodayKey())}`,
        `🎯 Meta Semana: Musculação ${week.gym}/4 | Vôlei ${week.volleyball}/2`,
        `📏 Última medição: ${Number(latest.weight).toFixed(1).replace('.', ',')} kg | ${latest.height || 164} cm`,
        `🥗 Hoje: ${mealsDone}/4 refeições | Água: ${((todayDiet.waterMl || 0) / 1000).toFixed(2).replace('.', ',')} L`,
        '',
        '🗂 Últimas sessões:'
      ];
      if (recent.length === 0) {
        lines.push('- Nenhuma sessão registrada ainda.');
      } else {
        recent.forEach(s => {
          const icon = s.type === 'volleyball' ? '🏐' : '🏋️';
          lines.push(`- ${icon} ${s.workoutName} (${formatShortDate(s.completedAt)}) · ${Math.round((s.durationSec || 0) / 60)} min · Esforço: ${s.effort || 'Moderado'}`);
        });
      }
      shareOrCopyText('Relatório Semanal — Maria Ester Fit', lines.join('\n'));
    }

    function exportBackupJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-maria-ester-fit-${getTodayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup (.json) baixado com sucesso!', 'success');
      } catch (err) {
        showToast('Erro ao exportar backup.', 'error');
      }
    }

    function openSmartphoneGuideModal() {
      openModal({
        title: '📱 Como Salvar na Tela Inicial do Celular',
        bodyHtml: `
          <div class="space-y-3 text-xs text-slate-300 leading-relaxed">
            <div class="bg-[#0b1120] border border-violet-500/35 rounded-xl p-3.5 space-y-1.5">
              <div class="font-extrabold text-violet-300">🤖 Samsung / Android — Opção 1 (Mais Completa: Netlify Drop)</div>
              <ol class="list-decimal list-inside space-y-1">
                <li>Renomeie o arquivo para <code class="text-teal-300">index.html</code> dentro de uma pasta e envie gratuitamente em <strong>app.netlify.com/drop</strong>.</li>
                <li>Abra o link <code class="text-teal-300">https://...</code> gerado no <strong>Chrome</strong> ou <strong>Samsung Internet</strong>.</li>
                <li>Toque no menu <strong>⋮</strong> (ou <strong>☰</strong>) → <strong>Adicionar à tela inicial</strong>.</li>
                <li>Abre em tela cheia como um app real e libera vídeos internos sem erro!</li>
              </ol>
            </div>

            <div class="bg-[#0b1120] border border-teal-500/35 rounded-xl p-3.5 space-y-1.5">
              <div class="font-extrabold text-teal-300">📂 Samsung / Android — Opção 2 (Rápida: Meus Arquivos)</div>
              <ol class="list-decimal list-inside space-y-1">
                <li>Abra o app <strong>Meus Arquivos</strong> (Samsung) → <strong>Downloads</strong>.</li>

              <div class="font-extrabold text-white">🍎 iPhone / iPad (Safari)</div>
              <ol class="list-decimal list-inside space-y-1">
                <li>Abra o link hospedado (<code class="text-teal-300">https://...</code> via Netlify Drop) no <strong>Safari</strong>.</li>
                <li>Toque no botão <strong>Compartilhar</strong> (quadrado com seta para cima).</li>

    /**
     * ============================================================================
     * RENDERIZAÇÃO GLOBAL E INICIALIZAÇÃO SEGURA
     * ============================================================================
     */
    function switchTab(tabId) {
      state.activeTab = tabId;
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavStyles() {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = `nav-tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
          active ? 'bg-[#8b5cf6] text-white shadow-sm' : 'text-slate-300 hover:text-white'
        }`;
      });
      document.querySelectorAll('.nav-tab-btn-mobile').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = `nav-tab-btn-mobile flex flex-col items-center justify-center py-2 rounded-xl text-[11px] font-bold transition-all ${
          active ? 'bg-violet-500/18 text-violet-300 border border-violet-500/40' : 'text-slate-400'
        }`;
      });
    }

    function renderApp() {
      try {
        updateNavStyles();
        const root = document.getElementById('appRoot');
        if (!root) return;

        if (state.activeTab === 'treino') {
          root.innerHTML = renderTreinoTab();
          bindTreinoEvents();
        } else if (state.activeTab === 'dieta') {
          root.innerHTML = renderDietaTab();
          bindDietaEvents();
        } else {
          root.innerHTML = renderEvolucaoTab();
          bindEvolucaoEvents();
        }
      } catch (err) {
        console.error('Erro ao renderizar interface:', err);
        const root = document.getElementById('appRoot');
        if (root) {
          root.innerHTML = `<div class="p-4 rounded-xl bg-rose-500/15 border border-rose-500/40 text-xs text-rose-200">Erro ao carregar interface: ${escapeHtml(err.message)}</div>`;
        }
      }
    }

    function initApp() {
      loadState();

      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      const installTop = document.getElementById('btnOpenInstallTop');
      if (installTop) installTop.addEventListener('click', openSmartphoneGuideModal);

      const restAdd = document.getElementById('btnRestAdd15');
      if (restAdd) {
        restAdd.addEventListener('click', () => {
          ui.restRemainingSec += 15;
          const d = document.getElementById('restTimerDisplay');
          if (d) d.textContent = formatMMSS(ui.restRemainingSec);
        });
      }
      const restSkip = document.getElementById('btnRestSkip');
      if (restSkip) restSkip.addEventListener('click', stopRestTimer);

      const mCloseX = document.getElementById('modalCloseX');
      const mCancel = document.getElementById('modalCancelBtn');
      const mConfirm = document.getElementById('modalConfirmBtn');
      const mBackdrop = document.getElementById('appModal');

      if (mCloseX) mCloseX.addEventListener('click', closeModal);
      if (mCancel) mCancel.addEventListener('click', closeModal);
      if (mBackdrop) {
        mBackdrop.addEventListener('click', (e) => {
          if (e.target.id === 'appModal') closeModal();
        });
      }
      if (mConfirm) {
        mConfirm.addEventListener('click', () => {
          const cb = ui.modalConfirmCb;
          closeModal();
          if (typeof cb === 'function') cb();
        });
      }

      const impInput = document.getElementById('importJsonInput');
      if (impInput) {
        impInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              state = mergeStateSafely(JSON.parse(String(ev.target.result)));
              persistState();
              renderApp();
              showToast('Backup restaurado com sucesso!', 'success');
            } catch {
              showToast('Arquivo de backup inválido.', 'error');
            }
          };
          reader.readAsText(file);
          e.target.value = '';
        });
      }

      if (state.activeSession && state.activeSession.running) {
        ensureRunningSessionTicker();
      }

      renderApp();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
